<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ESP LittleFS Fast Writer</title><link rel="stylesheet" href="style.css"></head><body><main><h1>ESP LittleFS Fast Writer</h1><p>Build a fresh LittleFS image locally and flash it without downloading the existing filesystem.</p><section><button id="connect">Connect ESP</button><span id="status">Disconnected</span></section><section><h2>Partition</h2><pre id="partition">Connect to detect partition table…</pre></section><section><h2>Files</h2><input id="files" type="file" multiple><ul id="fileList"></ul><button id="build" disabled>Build LittleFS Image</button></section><section><pre id="image">No image built.</pre><button id="write" disabled>Erase + Write LittleFS</button><progress id="progress" max="100" value="0"></progress></section><section><h2>Log</h2><pre id="log"></pre></section></main><script type="module" src="app.js"></script></body></html>
