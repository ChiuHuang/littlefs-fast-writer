name: Inject build hash (disabled — Vercel build script handles this now)

on:
  workflow_dispatch: # only run manually if needed
  # push:
  #   branches: [main]

jobs:
  inject:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Don't retrigger on the action's own commit
    if: "!contains(github.event.head_commit.message, '[ci skip]')"

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get pushed commit short SHA (7 chars)
        id: sha
        run: |
          HASH=$(git rev-parse --short=7 ${{ github.sha }})
          echo "hash=$HASH"          >> $GITHUB_OUTPUT
          echo "a=${HASH:0:3}"       >> $GITHUB_OUTPUT
          echo "b=${HASH:3:2}"       >> $GITHUB_OUTPUT
          echo "c=${HASH:5:2}"       >> $GITHUB_OUTPUT

      - name: Inject hash parts into HTML, CSS, JS
        run: |
          A="${{ steps.sha.outputs.a }}"
          B="${{ steps.sha.outputs.b }}"
          C="${{ steps.sha.outputs.c }}"

          # index.html  — match the attribute, replace whatever value is there
          sed -i "s/name=\"bh-a\" content=\"[^\"]*\"/name=\"bh-a\" content=\"$A\"/" index.html

          # style.css   — match the custom property, replace its value
          sed -i "s/--bh-b: \"[^\"]*\";/--bh-b: \"$B\";/" style.css

          # app.js      — match the const declaration, replace its value
          sed -i "s/const HASH_C = '[^']*';/const HASH_C = '$C';/" app.js

      - name: Commit injected hash
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html style.css app.js
          git diff --cached --quiet || git commit -m "ci: inject build hash ${{ steps.sha.outputs.hash }} [ci skip]"
          git push
