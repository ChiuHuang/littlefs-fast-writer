name: Inject build hash

on:
  push:
    branches: [main]

jobs:
  inject:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Don't retrigger on the action's own commit
    if: "!contains(github.event.head_commit.message, '[ci skip]')"

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get pushed commit short SHA (7 chars)
        id: sha
        run: |
          HASH=$(git rev-parse --short=7 ${{ github.sha }})
          echo "hash=$HASH"          >> $GITHUB_OUTPUT
          echo "a=${HASH:0:3}"       >> $GITHUB_OUTPUT
          echo "b=${HASH:3:2}"       >> $GITHUB_OUTPUT
          echo "c=${HASH:5:2}"       >> $GITHUB_OUTPUT

      - name: Inject hash parts into HTML, CSS, JS
        run: |
          A="${{ steps.sha.outputs.a }}"
          B="${{ steps.sha.outputs.b }}"
          C="${{ steps.sha.outputs.c }}"

          # index.html  — meta tag content
          sed -i "s/__HASH_A__/$A/g" index.html

          # style.css   — CSS custom property + comment
          sed -i "s/__HASH_B__/$B/g" style.css

          # app.js      — JS constant
          sed -i "s/__HASH_C__/$C/g" app.js

      - name: Commit injected hash
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html style.css app.js
          git diff --cached --quiet || git commit -m "ci: inject build hash ${{ steps.sha.outputs.hash }} [ci skip]"
          git push
